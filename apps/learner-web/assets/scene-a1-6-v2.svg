    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7a8b99"/><stop offset=".45" stop-color="#ecf3f7"/><stop offset="1" stop-color="#7f94a5"/></linearGradient>
  </defs>
  <rect width="720" height="320" rx="24" fill="#f2f7fb"/>
  <ellipse cx="209" cy="268" rx="125" ry="15" fill="#879bb2" opacity=".25"/>
