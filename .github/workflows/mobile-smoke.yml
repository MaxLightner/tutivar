name: Tutivar Deployed Mobile Smoke
on:
  push:
    branches: [test/leitner-mobile-smoke-20261028]
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test deployed learner on mobile viewport
        run: node .ci/mobile-smoke.mjs
